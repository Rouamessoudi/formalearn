apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: formalearn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: formalearn-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: formalearn-config
            - secretRef:
                name: formalearn-secrets
          env:
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: formalearn-secrets
                  key: MYSQL_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: formalearn
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
