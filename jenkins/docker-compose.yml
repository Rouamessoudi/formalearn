# Jenkins seul. UI : http://localhost:9090
# Compte démo : admin / change_me_jenkins
# L’application LMS se lance avec le docker-compose.yml à la racine (mysql, ml, backend, frontend).

services:
  jenkins:
    build: .
    image: formalearn-jenkins:local
    container_name: formalearn-jenkins
    user: root
    ports:
      - "9090:8080"
      - "50000:50000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
      JENKINS_ADMIN_ID: admin
      JENKINS_ADMIN_PASSWORD: change_me_jenkins
      MYSQL_HOST: host.docker.internal
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: formation_platform
      MYSQL_USER: root
      MYSQL_PASSWORD: ""
      ML_BASE_URL: http://host.docker.internal:8000
    env_file:
      - ../.env
    volumes:
      - jenkins_home:/var/jenkins_home
      - //var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ..
        target: /workspace
        read_only: true
      - type: bind
        source: ../.sonar-token
        target: /run/secrets/sonar-token
        read_only: true

volumes:
  jenkins_home:
